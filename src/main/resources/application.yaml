server:
  port: 8081

spring:
  application:
    name: ms-rutaexpress-shipments
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:shipmentsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplaza TENANT_ID por tu ID de inquilino de Azure AD
          issuer-uri: https://login.microsoftonline.com/TENANT_ID/v2.0